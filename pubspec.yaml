name: my_manager
description: "My Manager is a personal finance management application that helps users track income, expenses, transactions, and manage their personal finances efficiently."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  csv: ^8.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true


